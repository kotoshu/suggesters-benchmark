# Benchmark lanes — engines, datasets, and scoring configuration.
#
# Each ENGINE lane is a contender. Each DATASET lane is a labelled
# typo/correction pair set built by extract_pairs.py (pairs are never
# redistributed; build them locally from the GitHub Typo Corpus).
#
#   python3 benchmark.py --lanes lanes.yaml --lang en --max 2000
#
# Add a lane to benchmark a new contender; the harness discovers
# lanes from this file so results stay comparable across runs.

engines:
  kotoshu:
    kind: kotoshu
    setup: KOTOSHU_BACKEND=ruby        # the Ruby ranking pipeline
    note: kotoshu gem (SymSpell frequency channel + language-aware ranking)
  hunspell:
    kind: hunspell
    dict_env: HUNSPELL_DICT_DIR        # dir containing <lang>.aff/.dic (e.g. LibreOffice dictionaries)
    note: ispell -a protocol
  symspell:
    kind: symspell
    freq_note: fed the same frequency table as the kotoshu SymSpell channel
    note: symspellpy, TOP mode (returns one candidate; top1==top3==top5)
  languagetool:
    kind: languagetool
    api: https://api.languagetoolplus.com/v2/check
    rate_limit_note: public API — bounded subsample only
    note: sentence-checker contract; isolated-word queries score 0 by shape
  quill:
    kind: quill
    setup: pip install git+https://github.com/KenWuqianghao/quill   # model file ships in the package (data CC BY-SA 4.0)
    note: >-
      pure-Python noisy-channel suggester, CPU-only, no LLM, no network (~1.8k queries/s on one core):
      WikiText-103 + Stack Overflow unigram prior, edit channel learned from GitHub Typo Corpus pairs
      disjoint from the frozen splits, ranker fitted by cross-validation on those pairs.
      Answers VALID words too (never returns the input), so its realword numbers are not comparable
      with the dictionary-gated lanes; compare them with Hunspell forced to suggest for accepted words.

datasets:
  en:
    nonword: data/en.suggest-nonword.json
    realword: data/en.suggest-realword.json
  de:
    nonword: data/de.suggest-nonword.json
    realword: data/de.suggest-realword.json

scoring:
  match: case-insensitive exact
  cutoffs: [1, 3, 5]
